# Dev quotidien   : docker compose up -d postgres   (API et front lances en local)
# Demo complete   : docker compose --profile full up -d --build   -> http://localhost:${WEB_HOST_PORT}
# Arret           : docker compose --profile full down            (ajouter -v pour effacer la base)
# Demo + IoT      : docker compose --profile full --profile iot up -d --build
# Outils base     : docker compose --profile tools up -d adminer   -> http://localhost:8090
# Dashboards      : inclus dans le profil full                      -> http://localhost:${GRAFANA_HOST_PORT:-3000}


x-api-base: &api-base
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: campus-connect-api:local
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ANALYTICS_API_KEY: ${ANALYTICS_API_KEY:-}
    IOT_DEVICE_KEY: ${IOT_DEVICE_KEY:-}
    IOT_ONLINE_THRESHOLD_SECONDS: ${IOT_ONLINE_THRESHOLD_SECONDS:-120}
    CONSOLE_TOKEN_SECRET: ${CONSOLE_TOKEN_SECRET:-}
    CONSOLE_TOKEN_TTL_SECONDS: ${CONSOLE_TOKEN_TTL_SECONDS:-3600}
    CONSOLE_RESPONSABLE_HASH: ${CONSOLE_RESPONSABLE_HASH:-}
    CONSOLE_INTERVENANT_HASH: ${CONSOLE_INTERVENANT_HASH:-}
    CONSOLE_ETUDIANT_HASH: ${CONSOLE_ETUDIANT_HASH:-}
    APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
    LLM_ENABLED: ${LLM_ENABLED:-false}
    LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
    LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b}
    LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-8}
    LLM_MAX_PASSAGE_CHARS: ${LLM_MAX_PASSAGE_CHARS:-600}
    LLM_KEEP_ALIVE: ${LLM_KEEP_ALIVE:-10m}
  networks:
    - campus_backend
  profiles:
    - full

services:
  postgres:
    image: postgres:16-alpine
    container_name: campus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - campus_backend

  # One-shot : applique les migrations Alembic puis se termine
  migrate:
    <<: *api-base
    container_name: campus-migrate
    command: python -m alembic upgrade head
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # API FastAPI : non publiee sur l'hote, accessible uniquement via nginx
  api:
    <<: *api-base
    container_name: campus-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Front React (build Vite) servi par nginx + reverse proxy vers l'API
  web:
    build:
      context: ./frontend
    image: campus-connect-web:local
    container_name: campus-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - campus_backend
    profiles:
      - full

  # IoT simule : capteur de salle (profil iot, a lancer avec le profil full)
  sensor:
    <<: *api-base
    container_name: campus-sensor
    restart: unless-stopped
    command: python -m backend.scripts.iot.kiosk_simulator --role sensor --api-url http://api:8000 --interval 5
    environment:
      IOT_DEVICE_KEY: ${IOT_DEVICE_KEY:-}
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - iot

  # IoT simule : borne d'accueil (heartbeat + questions au chatbot, canal kiosk)
  kiosk:
    <<: *api-base
    container_name: campus-kiosk
    restart: unless-stopped
    command: python -m backend.scripts.iot.kiosk_simulator --role kiosk --api-url http://api:8000 --interval 10 --chat-every 3
    environment:
      IOT_DEVICE_KEY: ${IOT_DEVICE_KEY:-}
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - iot

  # Outil d'administration de la base (profil tools) : http://localhost:8090
  adminer:
    image: adminer:latest
    container_name: campus-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:${ADMINER_HOST_PORT:-8090}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campus_backend
    profiles:
      - tools

  # LLM local : reformule les reponses de la base.
  # Non publie sur l'hote. Modele a telecharger une fois.
  ollama:
    image: ollama/ollama
    container_name: campus-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - campus_backend
    profiles:
      - llm

  # Dashboards analytics (Grafana) branches sur PostgreSQL : http://localhost:3000
  grafana:
    image: grafana/grafana:11.3.0
    container_name: campus-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Autorise l'affichage du dashboard dans l'onglet Statistiques de l'espace admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/campus-connect.json
      # Lus par provisioning/datasources/postgres.yaml
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campus_backend
    profiles:
      - full

volumes:
  postgres_data:
  ollama_data:
  grafana_data:

networks:
  campus_backend:
    driver: bridge
