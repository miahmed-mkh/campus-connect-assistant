server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Taille max des requetes (messages du chat)
    client_max_body_size 1m;

    # En-tetes de securite de base
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API FastAPI : seule porte d'entree, l'API n'est pas publiee sur l'hote
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location = /docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Assets Vite (hashes) : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA React : toute route inconnue renvoie index.html.
    # index.html doit etre revalide a chaque visite : sinon le navigateur
    # garde une ancienne copie qui charge l'ancien bundle apres un deploiement.
    # Un add_header ici annule ceux du serveur : on repete les en-tetes de securite.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri $uri/ /index.html;
    }
}
