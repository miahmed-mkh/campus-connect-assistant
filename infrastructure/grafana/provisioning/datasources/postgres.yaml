# Connexion automatique de Grafana a la base PostgreSQL du projet.
# Les variables viennent de compose.yaml (elles-memes lues dans le .env).
apiVersion: 1

datasources:
  - name: Campus Connect DB
    uid: campus-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: $POSTGRES_USER
    isDefault: true
    editable: false
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: $POSTGRES_PASSWORD
